services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: laravel-app
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    ports:
      - "9000:9000"

  nginx:
    image: nginx:stable-alpine
    container_name: laravel-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - appnet

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: laravel-reverb
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
    ports:
      - "6001:6001"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - appnet

  comfyui:
    build:
      context: .
      dockerfile: docker/comfyui/Dockerfile
    container_name: laravel-comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./comfyui:/workspace
      - ./comfyui/models:/comfyui/models
    networks:
      - appnet

  node:
    image: node:20
    container_name: laravel-node
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    volumes:
      - ./:/app
    ports:
      - "5174:5174"
    depends_on:
      - app
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: laravel-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: laravel
      PMA_PASSWORD: secret
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - appnet

volumes:
  db_data:
  storage_data:
  cache_data:

networks:
  appnet:
